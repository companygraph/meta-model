# The mechanical half of R0, for an instance that has no build step of its own. An instance
# calls this at the release its `.companygraph/manifest.json` names:
#
#   jobs:
#     companygraph:
#       uses: companygraph/meta-model/.github/workflows/instance-check.yml@vX.Y.Z
#
# where vX.Y.Z is the release the manifest's `tooling` names, so the two move together.
# and holds one file and one pin. The checker has no dependencies but the Markdown form's,
# markdownlint-cli2, which npx fetches at the version the release pins; the release is checked out
# beside the caller and run from there. A maintainer with no Node still gets the gate, because
# nothing here runs locally.
#
# The ref below is this file's own release, and it is what makes the guard possible: the runner
# exposes nothing about the called workflow to its steps, so it cannot see how the caller
# spelled the ref. The checker it checks out compares its own version against the pin in the
# instance's manifest and refuses when they differ, which is the same shape as the conventions
# guard and it is there for the same reason. Before tagging a release, set this ref and
# `version` in package.json to that tag together.
name: companygraph
on:
  workflow_call:
jobs:
  companygraph:
    name: companygraph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: the checker, at the release this workflow is
        uses: actions/checkout@v7
        with:
          repository: companygraph/meta-model
          ref: v0.79.0
          path: .companygraph-checker
      - name: the instance is held to the core it vendored
        run: node .companygraph-checker/bin/check-instance.mjs .
      # The one Markdown form, with the rules and the markdownlint version this release pins. npx
      # fetches the tool, the one thing this workflow installs, because a form held by one tool in
      # CI and another in the editor is two forms. It runs whether or not the model's check
      # passed, so one failure does not hide the form's hits until the next push.
      - name: every Markdown file is in the one form
        if: ${{ !cancelled() }}
        run: node .companygraph-checker/bin/companygraph.mjs form .
      # A pull request's commits, each judged against the seats this instance declares. Only on a
      # pull request: a push to main carries the owner's merge, which is the owner's.
      - name: every commit names a seat its phase lists
        if: github.event_name == 'pull_request'
        run: node .companygraph-checker/bin/companygraph.mjs commits . --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # What a pull request may do to a page already on the default branch: an id never changes
      # (R18), a decision is not rewritten or removed, and a label stays with its item and is never
      # used again (R16), each compared after the Markdown form. A range that changes the vendored
      # schema governing the decision or the label check is not held to that check, since a release
      # may reshape those pages with it. Only on a pull request, as the seat check, and over the
      # same range; checkout's full history is what lets git pair a rename and read where the
      # branch began.
      - name: no id changed, no decision rewritten, no label moved
        if: github.event_name == 'pull_request'
        run: node .companygraph-checker/bin/companygraph.mjs ids . --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
