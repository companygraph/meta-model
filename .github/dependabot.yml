# GitHub Actions, and the compiler. package.json declares no runtime dependency: what a consumer
# installs is the committed JavaScript and nothing else. Its two devDependencies, TypeScript and
# Node's types, compile src/ in CI only to hold the committed JavaScript to it, so a bump arrives
# grouped, on its own, and is read before it is merged: a new compiler can write different
# JavaScript, and then build:check fails until `npm run build` is run and its output committed.
# Node's types stay on the major of `engines`, since the code runs on Node 22.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compiler:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
